<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astroidal Torus - Filled with Lighting</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .subtitle {
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 500px;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        canvas {
            display: block;
            background-color: #000;
        }
        .controls {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 10px;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 150px;
        }
        .wireframe-toggle {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #357abd;
        }
        .value-display {
            font-size: 0.9em;
            margin-top: 5px;
        }
        .shading-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Astroidal Torus</h1>

        <div class="canvas-container">
            <canvas id="glcanvas"></canvas>
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="rotationX">Rotation X</label>
                <input type="range" id="rotationX" min="0" max="360" value="30">
                <div class="value-display" id="rotationXValue">30°</div>
            </div>
            <div class="control-group">
                <label for="rotationY">Rotation Y</label>
                <input type="range" id="rotationY" min="0" max="360" value="45">
                <div class="value-display" id="rotationYValue">45°</div>
            </div>
            <div class="control-group">
                <label for="uSegments">U Segments</label>
                <input type="range" id="uSegments" min="10" max="100" value="30">
                <div class="value-display" id="uSegmentsValue">30</div>
            </div>
            <div class="control-group">
                <label for="vSegments">V Segments</label>
                <input type="range" id="vSegments" min="10" max="100" value="30">
                <div class="value-display" id="vSegmentsValue">30</div>
            </div>
            <div class="control-group">
                <label for="scale">Scale</label>
                <input type="range" id="scale" min="1" max="10" value="5" step="0.1">
                <div class="value-display" id="scaleValue">5.0</div>
            </div>
        </div>

        <div class="shading-controls">
            <div class="control-group">
                <label for="ambient">Ambient</label>
                <input type="range" id="ambient" min="0" max="1" value="0.2" step="0.01">
                <div class="value-display" id="ambientValue">0.2</div>
            </div>
            <div class="control-group">
                <label for="diffuse">Diffuse</label>
                <input type="range" id="diffuse" min="0" max="1" value="0.7" step="0.01">
                <div class="value-display" id="diffuseValue">0.7</div>
            </div>
            <div class="control-group">
                <label for="specular">Specular</label>
                <input type="range" id="specular" min="0" max="1" value="0.5" step="0.01">
                <div class="value-display" id="specularValue">0.5</div>
            </div>
            <div class="control-group">
                <label for="shininess">Shininess</label>
                <input type="range" id="shininess" min="1" max="100" value="32">
                <div class="value-display" id="shininessValue">32</div>
            </div>
        </div>

        <div class="wireframe-toggle">
            <button id="toggleWireframe">Toggle Wireframe</button>
            <button id="toggleLightAnimation">Toggle Light Animation</button>
            <button id="resetView">Reset View</button>
        </div>
    </div>

    <script src="js/m4.js"></script>
    <script src="js/shader.js"></script>
    <script src="js/model.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
